<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="카카오페이 300,000원 송금 도착" />
  <meta property="og:description" content="친한 친구님이 300,000원을 보냈어요. 지금 바로 확인하세요!" />
  <meta property="og:image"       content="https://jiwon252177-byte.github.io/kakaoprank/og-image.png" />
  <meta property="og:url"         content="https://jiwon252177-byte.github.io/kakaoprank" />
  <title>카카오페이</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    #phase1 {
      width: 100%; max-width: 400px;
      background: #FAE100; min-height: 100vh;
      display: flex; flex-direction: column;
    }
    .kp-top { padding: 56px 24px 28px; }
    .kp-logo { font-size: 15px; font-weight: 900; color: #3A1D00; letter-spacing: -0.3px; margin-bottom: 24px; }
    .kp-badge { display: inline-block; background: #00C073; color: white; font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 20px; margin-bottom: 14px; }
    .kp-amount { font-size: 40px; font-weight: 800; color: #1A1A1A; letter-spacing: -1px; margin-bottom: 6px; }
    .kp-subtitle { font-size: 15px; color: #6B4F00; }
    .kp-card { flex: 1; background: white; border-radius: 24px 24px 0 0; padding: 28px 24px; }
    .kp-row { display: flex; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid #F5F5F5; font-size: 14px; }
    .kp-row:last-of-type { border-bottom: none; }
    .kp-row .label { color: #AAAAAA; }
    .kp-row .val { font-weight: 600; color: #222; }
    .kp-divider { height: 1px; background: #F0F0F0; margin: 8px 0 20px; }
    .kp-btn { width: 100%; padding: 17px; background: #FAE100; border: none; border-radius: 14px; font-size: 17px; font-weight: 700; color: #3A1D00; cursor: pointer; margin-top: 16px; transition: transform 0.1s; }
    .kp-btn:active { transform: scale(0.98); }

    #phase2 {
      display: none;
      width: 100%; max-width: 400px; min-height: 100vh;
      background: #080808;
      flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 40px 24px;
    }
    .monster-wrap { animation: stomp 0.32s ease-in-out infinite alternate; }
    @keyframes stomp {
      from { transform: translateY(0px) scale(1, 1); }
      to   { transform: translateY(-30px) scale(0.94, 1.07); }
    }
    .scolding-text {
      font-size: 22px; font-weight: 900; color: #ff3b3b;
      line-height: 1.6; margin: 20px 0 28px;
      text-shadow: 0 0 24px rgba(255,40,40,0.7);
      animation: flicker 0.38s ease-in-out infinite alternate;
    }
    @keyframes flicker { from { opacity: 1; } to { opacity: 0.82; } }
    .reset-btn { padding: 12px 28px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; font-size: 14px; color: #666; cursor: pointer; }
  </style>
</head>
<body>

  <div id="phase1">
    <div class="kp-top">
      <div class="kp-logo">kakaopay</div>
      <div class="kp-badge">✓ 입금 완료</div>
      <div class="kp-amount">300,000원</div>
      <div class="kp-subtitle">송금이 도착했어요</div>
    </div>
    <div class="kp-card">
      <div class="kp-row"><span class="label">금액</span><span class="val">300,000원</span></div>
      <div class="kp-row"><span class="label">날짜</span><span class="val" id="today"></span></div>
      <div class="kp-row"><span class="label">메모</span><span class="val">잘써라</span></div>
      <div class="kp-divider"></div>
      <button class="kp-btn" onclick="reveal()">송금받기</button>
    </div>
  </div>

  <div id="phase2">
    <div class="monster-wrap">
      <canvas id="monsterCanvas" width="280" height="280"></canvas>
    </div>
    <div class="scolding-text">여행 그만 가고<br>아껴쓰고 열심히 일해라</div>
    <button class="reset-btn" onclick="reset()">다시 보기</button>
  </div>

  <script>
    document.getElementById('today').textContent =
      new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });

    let animId = null;
    let t = 0;

    function reveal() {
      document.getElementById('phase1').style.display = 'none';
      document.getElementById('phase2').style.display = 'flex';
      t = 0;
      drawMonster();
    }
    function reset() {
      document.getElementById('phase2').style.display = 'none';
      document.getElementById('phase1').style.display = 'flex';
      if (animId) { cancelAnimationFrame(animId); animId = null; }
    }

    function drawMonster() {
      const canvas = document.getElementById('monsterCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;

      function frame() {
        t += 0.07;
        ctx.clearRect(0, 0, W, H);

        const cx = W / 2;
        const cy = H / 2 + 20;
        const shake = Math.sin(t * 9) * 5;

        ctx.save();
        ctx.translate(cx + shake, cy);

        // 몸통
        ctx.beginPath();
        ctx.ellipse(0, 0, 68, 78, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#1e7a1e';
        ctx.fill();
        ctx.strokeStyle = '#0f4d0f';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 등 가시
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 22, -72);
          ctx.lineTo(i * 22 - 9, -110 - Math.abs(i) * 4);
          ctx.lineTo(i * 22 + 9, -110 - Math.abs(i) * 4);
          ctx.closePath();
          ctx.fillStyle = '#0f4d0f';
          ctx.fill();
        }

        // 눈
        for (let s of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(s * 24, -18, 17, 17, 0, 0, Math.PI * 2);
          ctx.fillStyle = 'white';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(s * 24 + s * 2, -15, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#ff0000';
          ctx.fill();
          ctx.beginPath();
          ctx.arc(s * 24 + s * 2, -15, 4, 0, Math.PI * 2);
          ctx.fillStyle = '#000';
          ctx.fill();
          // 화난 눈썹
          ctx.beginPath();
          ctx.moveTo(s * 8, -38);
          ctx.lineTo(s * 40, -30);
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 5;
          ctx.lineCap = 'round';
          ctx.stroke();
        }

        // 입
        ctx.beginPath();
        ctx.arc(0, 18, 36, 0.15, Math.PI - 0.15);
        ctx.fillStyle = '#7a0000';
        ctx.fill();
        ctx.fillStyle = 'white';
        for (let i = -2; i <= 2; i++) {
          ctx.beginPath();
          ctx.moveTo(i * 12, 18);
          ctx.lineTo(i * 12 - 7, 40);
          ctx.lineTo(i * 12 + 7, 40);
          ctx.closePath();
          ctx.fill();
        }

        // 팔
        const armSwing = Math.sin(t * 3) * 0.45;
        for (let s of [-1, 1]) {
          ctx.save();
          ctx.translate(s * 64, -5);
          ctx.rotate(s * (0.6 + armSwing));
          ctx.beginPath();
          ctx.ellipse(0, 32, 13, 38, 0, 0, Math.PI * 2);
          ctx.fillStyle = '#1e7a1e';
          ctx.fill();
          ctx.strokeStyle = '#0f4d0f';
          ctx.lineWidth = 2;
          ctx.stroke();
          for (let c = -1; c <= 1; c++) {
            ctx.beginPath();
            ctx.ellipse(c * 8, 67, 5, 10, c * 0.3, 0, Math.PI * 2);
            ctx.fillStyle = '#0f4d0f';
            ctx.fill();
          }
          ctx.restore();
        }

        // 다리
        for (let s of [-1, 1]) {
          ctx.beginPath();
          ctx.ellipse(s * 28, 68, 17, 28, s * 0.1, 0, Math.PI * 2);
          ctx.fillStyle = '#1e7a1e';
          ctx.fill();
          ctx.strokeStyle = '#0f4d0f';
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        // 💢
        ctx.font = '24px serif';
        ctx.fillText('💢', 55, -55);
        ctx.fillText('💢', -82, -48);

        ctx.restore();

        // 바닥 충격파
        const alpha = Math.abs(Math.sin(t * 3)) * 0.55;
        ctx.save();
        ctx.translate(cx, H - 8);
        ctx.scale(1, 0.22);
        ctx.beginPath();
        ctx.arc(0, 0, 60 + Math.abs(Math.sin(t * 3)) * 22, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,80,0,${alpha})`;
        ctx.fill();
        ctx.restore();

        animId = requestAnimationFrame(frame);
      }
      frame();
    }
  </script>
</body>
</html>
