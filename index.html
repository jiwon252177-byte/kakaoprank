<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ 카카오톡 링크 미리보기용 OG 태그 -->
  <!-- og:image는 배포 후 실제 URL로 반드시 교체하세요! -->
  <meta property="og:type"        content="website" />
  <meta property="og:title"       content="카카오페이 300,000원 송금 도착" />
  <meta property="og:description" content="친한 친구님이 300,000원을 보냈어요. 지금 바로 확인하세요!" />
  <meta property="og:image"       content="https://jiwon252177-byte.github.io/kakaoprank/og-image.png" />
  <meta property="og:url"         content="https://jiwon252177-byte.github.io/kakaoprank" />

  <title>카카오페이</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: #f2f2f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Phase 1: 가짜 카카오페이 화면 ── */
    #phase1 {
      width: 100%;
      max-width: 400px;
      background: #FAE100;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .kp-top {
      padding: 56px 24px 28px;
    }
    .kp-logo {
      font-size: 15px;
      font-weight: 900;
      color: #3A1D00;
      letter-spacing: -0.3px;
      margin-bottom: 24px;
    }
    .kp-badge {
      display: inline-block;
      background: #00C073;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .kp-amount {
      font-size: 40px;
      font-weight: 800;
      color: #1A1A1A;
      letter-spacing: -1px;
      margin-bottom: 6px;
    }
    .kp-subtitle {
      font-size: 15px;
      color: #6B4F00;
    }

    .kp-card {
      flex: 1;
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 28px 24px;
    }
    .kp-row {
      display: flex;
      justify-content: space-between;
      padding: 13px 0;
      border-bottom: 1px solid #F5F5F5;
      font-size: 14px;
    }
    .kp-row:last-of-type { border-bottom: none; }
    .kp-row .label { color: #AAAAAA; }
    .kp-row .val   { font-weight: 600; color: #222; }

    .kp-divider {
      height: 1px;
      background: #F0F0F0;
      margin: 8px 0 20px;
    }

    .kp-btn {
      width: 100%;
      padding: 17px;
      background: #FAE100;
      border: none;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 700;
      color: #3A1D00;
      cursor: pointer;
      margin-top: 16px;
      transition: transform 0.1s;
    }
    .kp-btn:active { transform: scale(0.98); }

    /* ── Phase 2: 낚시 완료 ── */
    #phase2 {
      display: none;
      width: 100%;
      max-width: 400px;
      min-height: 100vh;
      background: white;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 32px;
    }

    .gotcha-emoji { font-size: 72px; margin-bottom: 16px; animation: bounce 0.6s ease infinite alternate; }
    @keyframes bounce {
      from { transform: translateY(0) rotate(-5deg); }
      to   { transform: translateY(-10px) rotate(5deg); }
    }

    .gotcha-title {
      font-size: 26px;
      font-weight: 800;
      color: #1A1A1A;
      margin-bottom: 10px;
    }
    .gotcha-desc {
      font-size: 15px;
      color: #888;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .dancers { font-size: 56px; display: flex; justify-content: center; gap: 8px; margin-bottom: 32px; }
    .d1 { animation: dance 0.45s ease-in-out infinite alternate; }
    .d2 { animation: dance 0.45s ease-in-out infinite alternate-reverse; }
    @keyframes dance {
      from { transform: rotate(-20deg) scale(0.95); }
      to   { transform: rotate(20deg)  scale(1.05); }
    }

    .reset-btn {
      padding: 12px 28px;
      background: #f5f5f5;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      color: #888;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Phase 1: 가짜 송금 화면 -->
  <div id="phase1">
    <div class="kp-top">
      <div class="kp-logo">kakaopay</div>
      <div class="kp-badge">✓ 입금 완료</div>
      <div class="kp-amount">300,000원</div>
      <div class="kp-subtitle">송금이 도착했어요</div>
    </div>

    <div class="kp-card">
      <div class="kp-row"><span class="label">금액</span><span class="val">300,000원</span></div>
      <div class="kp-row"><span class="label">날짜</span><span class="val" id="today"></span></div>
      <div class="kp-row"><span class="label">메모</span><span class="val">잘써라</span></div>
      <div class="kp-divider"></div>
      <button class="kp-btn" onclick="reveal()">확인하기</button>
    </div>
  </div>

  <!-- Phase 2: 낚시 완료 -->
  <div id="phase2">
    <div class="gotcha-emoji">🪤</div>
    <div class="gotcha-title">낚였다! 🎉</div>
    <div class="gotcha-desc">돈은 없고요...<br>만우절 축하해요 ㅋㅋㅋ</div>
    <div class="dancers">
      <span class="d1">🕺</span>
      <span class="d2">💃</span>
    </div>
    <button class="reset-btn" onclick="reset()">다시 보기</button>
  </div>

  <script>
    document.getElementById('today').textContent =
      new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });

    function reveal() {
      document.getElementById('phase1').style.display = 'none';
      document.getElementById('phase2').style.display = 'flex';
    }
    function reset() {
      document.getElementById('phase2').style.display = 'none';
      document.getElementById('phase1').style.display = 'flex';
    }
  </script>
</body>
</html>
